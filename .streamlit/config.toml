[theme]
base = "dark"
primaryColor = "#C9A84C"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#18181C"
textColor = "#EDEDEC"
font = "sans serif"

[client]
# Point 13 (Don't send extra data): Prevent internal stack trace leaks to users
showErrorDetails = false

[server]
headless = true
# Point 8 & 14 (Secure endpoints & CSRF protection): Enable XSRF protection
enableXsrfProtection = true
enableCORS = false
maxUploadSize = 10
