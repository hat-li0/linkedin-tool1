[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
font = "sans serif"

[client]
# Point 13 (Don't send extra data): Prevent internal stack trace leaks to users
showErrorDetails = false

[server]
headless = true
# Point 8 & 14 (Secure endpoints & CSRF protection): Enable XSRF protection
enableXsrfProtection = true
enableCORS = false
maxUploadSize = 10
